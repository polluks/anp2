# ANP2 C64 Linker Configuration
#
# Memory layout (continuous from $0801):
#   $0801 - $080C : BASIC load stub (SYS 2061)
#   $080D - $9FFF : Main code, data, and converted assets
#   $C000 - $CFFF : Screen and color RAM mirror
#   $D000 - $DFFF : VIC-II register shadow (used at runtime)

MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    MAIN:     start = $0801, size = $97FF, type = rw;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    CODE:     load = MAIN,   type = rw;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    BSS:      load = MAIN,   type = bss,  optional = yes;
}
